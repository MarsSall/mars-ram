plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.ssh'
version = '0.1.0'

android {
  namespace "expo.modules.ssh"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  sourceSets {
    // Single source of truth: consume the TS wire vector directly, never duplicate it.
    test.resources.srcDir '../../../../../packages/protocol/test/fixtures'
  }
  lintOptions {
    abortOnError false
  }
  packagingOptions {
    // Bouncy Castle ships JDK multi-release metadata that Android does not use.
    resources {
      excludes += ["META-INF/versions/**", "META-INF/BCKEY.DSA", "META-INF/BCKEY.SF"]
    }
  }
}

dependencies {
  testImplementation "junit:junit:4.13.2"
  // JVM implementation of Android's platform JSON API for pure wire tests.
  testImplementation "org.json:json:20240303"
  implementation "com.hierynomus:sshj:0.41.2"
  implementation "org.bouncycastle:bcprov-jdk18on:1.86"
  implementation "org.bouncycastle:bcpkix-jdk18on:1.86"
  implementation "androidx.biometric:biometric:1.1.0"
  // Google Play In-App Updates: Play performs the check; it adds no permission.
  implementation "com.google.android.play:app-update:2.1.0"
}
